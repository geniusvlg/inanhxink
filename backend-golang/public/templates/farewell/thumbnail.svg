<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" role="img" aria-label="Qua cau ky niem va chuyen bay quanh no">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dcecfd"/>
      <stop offset="0.55" stop-color="#f2f8ff"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <radialGradient id="puff">
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shotA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd08a"/>
      <stop offset="1" stop-color="#f08a5d"/>
    </linearGradient>
    <linearGradient id="shotB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fc6f0"/>
      <stop offset="1" stop-color="#5b86b8"/>
    </linearGradient>
    <linearGradient id="shotC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a8dcc6"/>
      <stop offset="1" stop-color="#5aa88b"/>
    </linearGradient>
    <linearGradient id="shotD" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9d8f2"/>
      <stop offset="1" stop-color="#8fa8cf"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#18447a" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="480" height="360" fill="url(#sky)"/>
  <ellipse cx="86" cy="96" rx="120" ry="46" fill="url(#puff)"/>
  <ellipse cx="404" cy="252" rx="132" ry="52" fill="url(#puff)"/>

  <!-- Title -->
  <text x="240" y="38" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif" font-size="21" font-weight="700" fill="#12263f" letter-spacing="1.2">Bon Voyage</text>
  <text x="240" y="57" text-anchor="middle" font-family="'Roboto Mono', monospace" font-size="11" fill="#6b8199" letter-spacing="3.4">HAN &#8594; HND</text>

  <!-- The plane's lap around the sphere -->
  <ellipse cx="240" cy="212" rx="156" ry="60" fill="none" stroke="#b9d5f0" stroke-width="3"
           stroke-linecap="round" stroke-dasharray="1 11" transform="rotate(-12 240 212)"/>

  <!-- Card backs around the rim of the ball -->
  <g filter="url(#soft)">
    <g transform="rotate(-22 148 200)">
      <rect x="122" y="166" width="52" height="68" rx="7" fill="#ffffff"/>
    </g>
    <g transform="rotate(20 336 202)">
      <rect x="310" y="168" width="52" height="68" rx="7" fill="#ffffff"/>
    </g>
    <g transform="rotate(4 240 134)">
      <rect x="214" y="104" width="52" height="62" rx="7" fill="#ffffff"/>
    </g>
    <g transform="rotate(-5 240 286)">
      <rect x="214" y="256" width="52" height="62" rx="7" fill="#ffffff"/>
    </g>
  </g>

  <!-- Memories on the near side -->
  <g filter="url(#soft)" transform="rotate(-15 178 172)">
    <rect x="148" y="134" width="60" height="76" rx="8" fill="#ffffff"/>
    <rect x="154" y="140" width="48" height="56" rx="4" fill="url(#shotB)"/>
  </g>

  <g filter="url(#soft)" transform="rotate(14 306 168)">
    <rect x="276" y="130" width="60" height="76" rx="8" fill="#ffffff"/>
    <rect x="282" y="136" width="48" height="56" rx="4" fill="url(#shotC)"/>
  </g>

  <g filter="url(#soft)" transform="rotate(-9 190 258)">
    <rect x="160" y="220" width="60" height="76" rx="8" fill="#ffffff"/>
    <rect x="166" y="226" width="48" height="56" rx="4" fill="url(#shotD)"/>
  </g>

  <!-- The memory facing the viewer -->
  <g filter="url(#soft)" transform="rotate(-3 252 214)">
    <rect x="212" y="164" width="80" height="100" rx="9" fill="#ffffff"/>
    <rect x="219" y="171" width="66" height="74" rx="5" fill="url(#shotA)"/>
    <rect x="219" y="251" width="34" height="6" rx="3" fill="#cddcec"/>
  </g>

  <!-- Plane on its lap -->
  <g filter="url(#soft)">
    <circle cx="94" cy="240" r="20" fill="#ffffff"/>
    <path d="M94 230 l7 17 -7 -3.4 -7 3.4 z" fill="#2563cb" transform="rotate(-28 94 240)"/>
  </g>
</svg>
