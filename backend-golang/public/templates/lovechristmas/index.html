<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cây thông Giáng sinh</title>
    <meta name="theme-color" content="#000000">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Noto+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/templates/lovechristmas/styles.css?v=20261117-1">
    <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.151.3/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.151.3/examples/jsm/",
             "gsap": "https://unpkg.com/gsap@3.11.5/index.js"
        }
    }
    </script>
</head>

<body>
    <div id="text-container"></div>
    <button id="start-screen" type="button" aria-label="Nhấn vào màn hình để mở cây thông">
        <p id="start-title" class="start-title">Merry Christmas</p>
        <span class="start-hint">Nhấn vào màn hình</span>
    </button>
    <p id="tree-hint" hidden>Chạm vào cây thông</p>
    <p id="photo-hint" hidden>Chạm vào ảnh để xem</p>
    <audio id="pop-sound">
        <source src="/templates/lovechristmas/pop.mp3" type="audio/mpeg">
    </audio>

    <!-- Modal cho ảnh -->
    <div id="image-modal" class="modal-overlay">
        <button class="modal-close-btn" id="modal-close-btn" type="button" aria-label="Đóng ảnh">
            &times;
        </button>
        <div class="modal-content">
            <img id="modal-image" src="" alt="Ảnh phóng to">
        </div>
    </div>

    <audio id="bg-audio" loop playsinline preload="auto" hidden crossorigin="anonymous"></audio>

    <script data-cfasync="false" src="/templates/lovechristmas/demo-data.js"></script>
    <script data-cfasync="false" type="module" src="/templates/lovechristmas/app.js?v=20261117-2"></script>
</body>
</html>
