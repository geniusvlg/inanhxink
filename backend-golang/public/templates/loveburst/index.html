<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0512">
  <title>Love Burst</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;1,400&family=Mali:ital,wght@0,400;0,500;0,600;1,400&family=Pacifico&family=Playwrite+VN:wght@200;300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="loading-overlay">
    <div class="loading-title">Đang chuẩn bị yêu thương...</div>
    <div class="loading-heart">💕</div>
    <div class="loading-text">Đang chuẩn bị quà tặng...</div>
    <div class="loading-bar"><div class="loading-progress" id="loading-progress"></div></div>
    <div class="loading-percent" id="loading-percent">0%</div>
  </div>

  <div id="start-wrap" role="button" tabindex="0" aria-label="Chạm để mở yêu thương">
    <div class="start-jewel" aria-hidden="true">
      <span class="start-orbit"></span>
      <span class="start-heart">♥</span>
      <span class="start-glint start-glint-one">✦</span>
      <span class="start-glint start-glint-two">✧</span>
      <span class="start-glint start-glint-three">✦</span>
    </div>
    <div class="start-invitation">
      <span class="start-kicker">MỘT MÓN QUÀ DÀNH CHO BẠN</span>
      <strong id="start-label">Chạm để mở yêu thương</strong>
      <span class="start-hint">♡</span>
    </div>
  </div>

  <div class="shooting-stars" id="shooting-stars"></div>
  <div id="sphere-container"></div>

  <div id="envelope-overlay">
    <div id="envelope-anim">
      <div class="env-letter-card">💌</div>
      <div class="env-body"><div class="env-fold-right"></div></div>
      <div class="env-flap-scene"><div class="env-flap"></div></div>
    </div>
  </div>

  <div id="love-popup">
    <div class="popup-card">
      <button class="popup-close" id="popup-close-btn" type="button" aria-label="Đóng">&times;</button>
      <h2 class="popup-title" id="popup-title">Gửi bé iu 💖</h2>
      <div class="popup-content">
        <div class="popup-image-container">
          <img class="popup-image" id="popup-image" alt="">
        </div>
        <div class="popup-message-container">
          <div class="popup-message" id="popup-message">
            <span class="typewriter" id="typewriter-text"></span>
            <span class="typewriter-cursor"></span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script data-cfasync="false" src="https://cdn.jsdelivr.net/npm/three@0.134.0/build/three.min.js"></script>
  <script data-cfasync="false" src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
  <script data-cfasync="false" src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/controls/TrackballControls.js"></script>
  <script data-cfasync="false" src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/renderers/CSS3DRenderer.js"></script>
  <script data-cfasync="false" src="./demo-data.js"></script>
  <script data-cfasync="false" type="module" src="./effects.js"></script>
  <script data-cfasync="false" src="./app.js"></script>
</body>
</html>
